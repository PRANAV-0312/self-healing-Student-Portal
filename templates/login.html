
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHeal | Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; font-family: Arial, sans-serif;
            background: #f2f5fc; color: #12352B;
        }
        .login-card {
            width: min(420px, 92%); background: white;
            padding: 32px; border-radius: 16px;
            box-shadow: 0 10px 35px #18284418;
        }
        h1 { margin-top: 0; }
        p { color: #60718b; }
        label { display: block; margin-top: 16px; }
        input {
            width: 100%; padding: 12px; margin-top: 7px;
            border: 1px solid #ccd5e4; border-radius: 7px;
        }
        button {
            width: 100%; padding: 12px; margin-top: 22px;
            border: 0; border-radius: 7px; color: white;
            background:#0F6B56; cursor: pointer;
        }
        .notice { color: #b42318; }
        .hint { font-size: 13px; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>🛡️ SmartHeal</h1>
        <p>Sign in to your student portal.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="notice">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input id="username" name="username" required
                   autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   required autocomplete="current-password">

            <button type="submit">Login</button>
        </form>

        
    </main>
</body>
</html>
